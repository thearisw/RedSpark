[project]
name = "redspark"
version = "0.1.0"
description = "A redstone-style circuit simulator and an RL agent that learns to build logic gates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2"]
server = ["starlette>=0.37", "uvicorn>=0.29", "websockets>=12"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redspark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
